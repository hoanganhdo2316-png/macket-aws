map $http_x_forwarded_proto $macket_proto {
    default $scheme;
    http http;
    https https;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location = /admin {
        return 301 /admin/;
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend backend-api:8000;
        proxy_pass http://$backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $macket_proto;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
