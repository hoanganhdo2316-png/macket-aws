name: Verify ECR OIDC (read only)

on:
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    environment: ecr-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      id-token: write
    env:
      ROLE_ARN: ${{ vars.MACKET_ECR_PUBLISH_ROLE_ARN }}
      RELEASE_TAG: 0.1.1-ec2-parity
    steps:
      - name: Verify configured role ARN
        run: test "$ROLE_ARN" = 'arn:aws:iam::393840684011:role/MacketGitHubECRPublishRole'
      - uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6
        with:
          aws-region: ap-southeast-1
          allowed-account-ids: '393840684011'
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: macket-ecr-read-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 900
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[
            {"Effect":"Allow","Action":"ecr:GetAuthorizationToken","Resource":"*"},
            {"Effect":"Allow","Action":["ecr:DescribeImages","ecr:BatchGetImage","ecr:BatchCheckLayerAvailability"],
            "Resource":["arn:aws:ecr:ap-southeast-1:393840684011:repository/macket-backend","arn:aws:ecr:ap-southeast-1:393840684011:repository/macket-frontend"]}]}
      - name: Verify ECR token and read the approved manifests
        shell: bash
        run: |
          set -euo pipefail
          manifest_for() {
            aws ecr batch-get-image --repository-name "$1" --image-ids "imageDigest=$2" \
              | jq -ec --arg digest "$2" '
                select((.failures | length) == 0 and (.images | length) == 1 and .images[0].imageId.imageDigest == $digest)
                | .images[0].imageManifest | fromjson
              '
          }
          aws ecr get-login-password >/dev/null
          echo 'PASS GetAuthorizationToken'
          for repository in macket-backend macket-frontend; do
            digest=$(aws ecr describe-images --repository-name "$repository" \
              --image-ids "imageTag=$RELEASE_TAG" --query 'imageDetails[0].imageDigest' --output text)
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf 'PASS %s DescribeImages %s\n' "$repository" "$digest"
            manifest=$(manifest_for "$repository" "$digest")
            printf 'PASS %s BatchGetImage %s\n' "$repository" "$digest"
            if jq -e 'has("manifests")' <<< "$manifest" >/dev/null; then
              platform_digest=$(jq -er '
                [.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")]
                | select(length == 1) | .[0].digest
              ' <<< "$manifest")
              [[ "$platform_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
              manifest=$(manifest_for "$repository" "$platform_digest")
            fi
            layer=$(jq -er '.layers[0].digest' <<< "$manifest")
            [[ "$layer" =~ ^sha256:[0-9a-f]{64}$ ]]
            aws ecr batch-check-layer-availability --repository-name "$repository" --layer-digests "$layer" \
              | jq -e --arg layer "$layer" '(.failures|length) == 0 and any(.layers[]; .layerDigest == $layer and .layerAvailability == "AVAILABLE")' >/dev/null
            printf 'PASS %s BatchCheckLayerAvailability\n' "$repository"
          done
