name: Approved Macket web deployment

on:
  workflow_dispatch:
    inputs:
      component:
        description: Web component to replace
        type: choice
        options: [backend, frontend]
        required: true
      digest:
        description: Approved immutable digest (sha256 followed by 64 hex characters)
        type: string
        required: true
  workflow_call:
    inputs:
      component:
        type: string
        required: true
      digest:
        type: string
        required: true

permissions: {}

concurrency:
  group: macket-production-web
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.MACKET_CD_ENABLED == 'true' && github.ref == 'refs/heads/main'
    environment: production
    timeout-minutes: 22
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      COMPONENT: ${{ inputs.component }}
      DIGEST: ${{ inputs.digest }}
      INSTANCE: ${{ vars.MACKET_EC2_INSTANCE_ID }}
      DOC_VERSION: ${{ vars.MACKET_SSM_DOCUMENT_VERSION }}
    steps:
      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$COMPONENT" == backend || "$COMPONENT" == frontend ]]
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            test "$COMPONENT" = frontend
          fi
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$INSTANCE" =~ ^i-[0-9a-f]{17}$ && "$DOC_VERSION" =~ ^[1-9][0-9]*$ ]]
      - uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6
        with:
          role-to-assume: ${{ vars.MACKET_CD_ROLE_ARN }}
          aws-region: ap-southeast-1
          allowed-account-ids: '393840684011'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: github.event_name == 'push'
        with:
          persist-credentials: false
      - name: Reject superseded Frontend inputs
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/main
          if ! git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- frontend/ ci/frontend-smoke.sh; then
            echo 'Frontend inputs on main have changed. Use the newer run.' >&2
            exit 1
          fi
      - name: Run the approved fixed SSM document
        shell: bash
        run: |
          set -euo pipefail
          params=$(jq -cn --arg component "$COMPONENT" --arg digest "$DIGEST" '{Component:[$component],Digest:[$digest]}')
          id=$(aws ssm send-command --document-name MacketWebRelease --document-version "$DOC_VERSION" --instance-ids "$INSTANCE" --parameters "$params" --query 'Command.CommandId' --output text)
          echo "Command ID: $id"
          for _ in {1..110}; do
            if status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" --query 'Status' --output text 2>&1); then
              case "$status" in
                Success) echo 'Deployment health checks passed'; exit 0 ;;
                Pending|InProgress|Delayed) ;;
                *) echo "Deployment ended with status $status" >&2; exit 1 ;;
              esac
            elif [[ "$status" != *InvocationDoesNotExist* ]]; then
              echo "$status" >&2; exit 1
            fi
            sleep 10
          done
          echo 'Timed out waiting for command; inspect SSM using the recorded ID' >&2
          exit 1
