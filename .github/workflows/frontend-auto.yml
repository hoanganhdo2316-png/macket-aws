name: Frontend CI and automatic delivery

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('macket-frontend-pr-{0}', github.event.pull_request.number) || 'macket-frontend-reconcile' }}
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && vars.MACKET_FRONTEND_AUTO_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
    outputs:
      inputs: ${{ steps.plan.outputs.inputs }}
      changed: ${{ steps.plan.outputs.changed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Frontend inputs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASELINE_SHA: ${{ vars.MACKET_FRONTEND_BASELINE_SHA }}
        run: python3 ci/frontend_inputs.py plan
      - name: Test Frontend release selection
        if: github.event_name == 'pull_request'
        run: python3 -B -m unittest discover -s tests -p test_frontend_inputs.py
      - name: Scan Git history and checkout
        shell: bash
        run: |
          set -euo pipefail
          scanner=ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          docker run --rm -v "$PWD:/src:ro" -w /src "$scanner" git --redact=100 --log-opts='--all' /src
          docker run --rm -v "$PWD:/src:ro" -w /src "$scanner" dir --redact=100 /src

  build:
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      archive_sha256: ${{ steps.gate.outputs.archive_sha256 }}
      image_id: ${{ steps.gate.outputs.image_id }}
      config_digest: ${{ steps.gate.outputs.config_digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build Frontend linux/amd64 and run smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --provenance=false -t macket-frontend:ci frontend
          bash ci/frontend-smoke.sh
      - name: Save and scan exact Frontend candidate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/frontend.tar"
          docker image save --platform linux/amd64 -o "$archive" macket-frontend:ci
          scanner=aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
          docker run --rm -v "$PWD/frontend:/src:ro" "$scanner" fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 /src
          docker run --rm -v "$archive:/image.tar:ro" "$scanner" image --input /image.tar --scanners secret --format json --exit-code 1 >/dev/null
          docker run --rm -v "$archive:/image.tar:ro" "$scanner" image --input /image.tar --scanners vuln --severity HIGH,CRITICAL --exit-code 1
          printf 'archive_sha256=%s\n' "$(sha256sum "$archive" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          printf 'image_id=%s\n' "$(docker image inspect --format '{{.Id}}' macket-frontend:ci)" >> "$GITHUB_OUTPUT"
          config=$(tar -xOf "$archive" manifest.json | jq -er '
            select(length == 1) | .[0].Config | split("/") | last | sub("[.]json$"; "")
            | select(test("^[a-f0-9]{64}$"))
          ')
          printf 'config_digest=sha256:%s\n' "$config" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250a479d7789f # v6
        id: upload
        if: github.event_name != 'pull_request'
        with:
          name: frontend-auto-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frontend.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  required:
    name: Frontend required
    needs: [plan, build]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Enforce applicable checks
        shell: bash
        env:
          PLAN: ${{ needs.plan.result }}
          CHANGED: ${{ needs.plan.outputs.changed }}
          BUILD: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          test "$PLAN" = success
          [[ "$CHANGED:$BUILD" == false:skipped || "$CHANGED:$BUILD" == true:success ]]

  publish:
    needs: [plan, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.MACKET_FRONTEND_AUTO_ENABLED == 'true' && needs.plan.outputs.changed == 'true' && needs.build.result == 'success'
    environment: frontend-ecr-auto
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    env:
      ARCHIVE_SHA256: ${{ needs.build.outputs.archive_sha256 }}
      IMAGE_ID: ${{ needs.build.outputs.image_id }}
      CONFIG_DIGEST: ${{ needs.build.outputs.config_digest }}
      ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
      ROLE_ARN: ${{ vars.MACKET_FRONTEND_AUTO_PUBLISH_ROLE_ARN }}
      REGISTRY: 393840684011.dkr.ecr.ap-southeast-1.amazonaws.com
      RELEASE_TAG: frontend-main-${{ github.sha }}
    steps:
      - name: Require a unique tested artifact
        shell: bash
        run: '[[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/candidate
      - name: Verify the tested artifact and role
        shell: bash
        run: |
          set -euo pipefail
          test "$ROLE_ARN" = 'arn:aws:iam::393840684011:role/MacketGitHubFrontendAutoPublishRole'
          [[ "$ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ && "$IMAGE_ID" =~ ^sha256:[0-9a-f]{64}$ && "$CONFIG_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          archive="$RUNNER_TEMP/candidate/frontend.tar"
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          docker load -i "$archive"
          test "$(docker image inspect --format '{{.Id}} {{.Os}}/{{.Architecture}}' macket-frontend:ci)" = "$IMAGE_ID linux/amd64"
      - uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ap-southeast-1
          allowed-account-ids: '393840684011'
          role-session-name: macket-front-publish-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 1200
      - name: Publish exact image and require a clean ECR gate
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          repository=macket-frontend
          describe_tag() {
            aws ecr describe-images --repository-name "$repository" --image-ids "imageTag=$RELEASE_TAG" \
              --query 'imageDetails[0].imageDigest' --output text
          }
          if ! existing=$(describe_tag 2>&1); then
            [[ "$existing" == *'(ImageNotFoundException)'* ]] || { printf '%s\n' "$existing" >&2; exit 1; }
            aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
            trap 'docker logout "$REGISTRY" >/dev/null' EXIT
            dest="$REGISTRY/$repository:$RELEASE_TAG"
            docker tag macket-frontend:ci "$dest"
            docker push --platform linux/amd64 "$dest" | tee "$RUNNER_TEMP/frontend-push.log"
            pushed=$(awk '$2 == "digest:" { print $3 }' "$RUNNER_TEMP/frontend-push.log")
            existing=$(describe_tag)
            test "$existing" = "$pushed"
          fi
          [[ "$existing" =~ ^sha256:[0-9a-f]{64}$ ]]
          manifest=$(aws ecr batch-get-image --repository-name "$repository" --image-ids "imageDigest=$existing")
          jq -e --arg config "$CONFIG_DIGEST" --arg digest "$existing" '
            (.failures | length) == 0 and (.images | length) == 1
            and .images[0].imageId.imageDigest == $digest
            and (.images[0].imageManifest | fromjson | .config.digest) == $config
          ' <<< "$manifest" >/dev/null
          for _ in {1..40}; do
            if scan=$(aws ecr describe-image-scan-findings --repository-name "$repository" --image-id "imageDigest=$existing" 2>&1); then
              case "$(jq -r '.imageScanStatus.status' <<< "$scan")" in
                COMPLETE)
                  jq -e '.imageScanFindings.findingSeverityCounts as $c | ($c.CRITICAL // 0) == 0 and ($c.HIGH // 0) == 0' <<< "$scan" >/dev/null
                  printf 'digest=%s\n' "$existing" >> "$GITHUB_OUTPUT"
                  printf 'ECR scan passed for %s@%s\n' "$repository" "$existing" >> "$GITHUB_STEP_SUMMARY"
                  exit 0 ;;
                PENDING|IN_PROGRESS) ;;
                *) printf 'ECR scan did not complete: %s\n' "$(jq -r '.imageScanStatus.status' <<< "$scan")" >&2; exit 1 ;;
              esac
            elif [[ "$scan" != *'(ScanNotFoundException)'* ]]; then
              printf '%s\n' "$scan" >&2
              exit 1
            fi
            sleep 10
          done
          echo 'Timed out waiting for the ECR scan' >&2
          exit 1

  deploy:
    needs: [plan, publish]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.MACKET_FRONTEND_AUTO_ENABLED == 'true'
    environment: frontend-production-auto
    concurrency:
      group: macket-production-web
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    permissions:
      contents: read
      id-token: write
    env:
      DIGEST: ${{ needs.publish.outputs.digest }}
      EXPECTED_INPUTS: ${{ needs.plan.outputs.inputs }}
      ROLE_ARN: ${{ vars.MACKET_FRONTEND_AUTO_DEPLOY_ROLE_ARN }}
      DOCUMENT_VERSION: ${{ vars.MACKET_FRONTEND_AUTO_DOCUMENT_VERSION }}
      DEPLOY_ENABLED: ${{ vars.MACKET_FRONTEND_DEPLOY_ENABLED }}
      INSTANCE: i-0c8a12e28de443f56
    steps:
      - name: Verify deployment configuration and switch
        shell: bash
        run: |
          set -euo pipefail
          test "$DEPLOY_ENABLED" = true
          test "$ROLE_ARN" = 'arn:aws:iam::393840684011:role/MacketGitHubFrontendAutoDeployRole'
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ && "$DOCUMENT_VERSION" =~ ^[1-9][0-9]*$ ]]
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ap-southeast-1
          allowed-account-ids: '393840684011'
          role-session-name: macket-front-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 1800
      - name: Reject stale inputs and release Frontend by digest
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/frontend_inputs.py require-current
          params=$(jq -cn --arg digest "$DIGEST" '{Digest:[$digest]}')
          id=$(aws ssm send-command --document-name MacketFrontendRelease --document-version "$DOCUMENT_VERSION" \
            --instance-ids "$INSTANCE" --parameters "$params" --timeout-seconds 60 --query 'Command.CommandId' --output text)
          printf 'SSM command %s for %s\n' "$id" "$DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"
          for _ in {1..110}; do
            if status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" --query 'Status' --output text 2>&1); then
              case "$status" in
                Success) echo 'Frontend deployment health checks passed'; exit 0 ;;
                Pending|InProgress|Delayed) ;;
                *) printf 'Release failed with SSM status %s. Check invocation and rollback.\n' "$status" >&2; exit 1 ;;
              esac
            elif [[ "$status" != *InvocationDoesNotExist* ]]; then
              printf '%s\n' "$status" >&2
              exit 1
            fi
            sleep 10
          done
          echo 'Timed out waiting for SSM. Confirm the invocation stopped before any retry.' >&2
          exit 1
