schemaVersion: '2.2'
description: Release the Macket Frontend by immutable ECR digest.
parameters:
  Digest:
    type: String
    allowedPattern: '^sha256:[a-f0-9]{64}$'
    interpolationType: ENV_VAR
mainSteps:
  - action: aws:runShellScript
    name: releaseFrontend
    inputs:
      timeoutSeconds: '900'
      runCommand:
        - 'set -eu'
        - 'exec /usr/bin/python3 /opt/macket-deploy/deploy_web.py frontend "$SSM_Digest"'
